<div class="boarding-house-form-page">
  <a class="back-link" routerLink="/boarding-houses">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5m7 7-7-7 7-7"/></svg>
    View My Boarding Houses
  </a>

  <header class="page-header">
    <h1>Add Boarding House</h1>
    <p>Submit your boarding house information for review. Fields marked with * are required.</p>
  </header>

  <p *ngIf="successMessage" role="status" class="notice notice-success">{{ successMessage }}</p>
  <p *ngIf="errorMessage" role="alert" class="notice notice-error">{{ errorMessage }}</p>

  <form #boardingHouseForm="ngForm" (ngSubmit)="submit(boardingHouseForm)">

    <section class="panel" aria-labelledby="basic-heading">
      <h2 id="basic-heading">Basic information</h2>
      <div class="fields">
        <div class="field full">
          <label for="name">Boarding House Name *</label>
          <input id="name" name="name" type="text" maxlength="255"
            [(ngModel)]="formModel.name" required />
        </div>

        <div class="field full">
          <label for="description">Description</label>
          <textarea id="description" name="description" rows="4"
            [(ngModel)]="formModel.description"></textarea>
        </div>

        <div class="field full">
          <label for="rules">Boarding House Rules</label>
          <textarea id="rules" name="rules" rows="4" maxlength="10000"
            [(ngModel)]="formModel.rules"
            placeholder="Enter house rules on separate lines"></textarea>
        </div>
      </div>
    </section>

    <section class="panel" aria-labelledby="location-heading">
      <h2 id="location-heading">Location</h2>
      <div class="fields">
        <div class="field">
          <label for="city">City *</label>
          <input id="city" name="city" type="text" maxlength="255"
            [(ngModel)]="formModel.city" required />
        </div>

        <div class="field">
          <label for="barangay">Barangay</label>
          <input id="barangay" name="barangay" type="text" maxlength="100"
            [(ngModel)]="formModel.barangay" />
        </div>

        <div class="field full">
          <label for="address">Street Address *</label>
          <input id="address" name="address" type="text" maxlength="255"
            [(ngModel)]="formModel.address" required />
        </div>
      </div>
    </section>

    <section class="panel" aria-labelledby="pricing-heading">
      <h2 id="pricing-heading">Pricing</h2>
      <div class="fields three">
        <div class="field">
          <label for="monthly_rent">Monthly Rent (PHP) *</label>
          <div class="input-prefix">
            <span aria-hidden="true">₱</span>
            <input id="monthly_rent" name="monthly_rent" type="number" min="0"
              step="0.01" [(ngModel)]="formModel.monthly_rent" required />
          </div>
        </div>

        <div class="field">
          <label for="security_deposit">Security Deposit (PHP)</label>
          <div class="input-prefix">
            <span aria-hidden="true">₱</span>
            <input id="security_deposit" name="security_deposit" type="number" min="0"
              step="0.01" [(ngModel)]="formModel.security_deposit" />
          </div>
        </div>

        <div class="field">
          <label for="advance_payment">Advance Payment (PHP)</label>
          <div class="input-prefix">
            <span aria-hidden="true">₱</span>
            <input id="advance_payment" name="advance_payment" type="number" min="0"
              step="0.01" [(ngModel)]="formModel.advance_payment" />
          </div>
        </div>

        <div class="field">
          <label for="late_payment_fee">Late Payment Fee (PHP)</label>
          <div class="input-prefix">
            <span aria-hidden="true">₱</span>
            <input id="late_payment_fee" name="late_payment_fee" type="number" min="0"
              step="0.01" [(ngModel)]="formModel.late_payment_fee" />
          </div>
        </div>

        <div class="field">
          <label for="grace_period_days">Grace Period (days)</label>
          <input id="grace_period_days" name="grace_period_days" type="number" min="0"
            step="1" [(ngModel)]="formModel.grace_period_days" />
        </div>

        <div class="field full">
          <label for="billing_policy">Rental Billing Policy *</label>
          <select id="billing_policy" name="billing_policy"
            [(ngModel)]="formModel.billing_policy" required>
            <option value="full_monthly">
              Full Monthly — charges the entire monthly rent when the tenant overlaps the billing month.
            </option>
            <option value="prorated">
              Prorated — charges based on the tenant's billable days.
            </option>
          </select>
        </div>
      </div>
    </section>

    <section class="panel" aria-labelledby="rooms-heading">
      <h2 id="rooms-heading">Rooms</h2>
      <div class="fields three">
        <div class="field">
          <label for="total_rooms">Total Rooms *</label>
          <input id="total_rooms" name="total_rooms" type="number" min="1"
            step="1" [(ngModel)]="formModel.total_rooms" required />
        </div>

        <div class="field">
          <label for="available_rooms">Available Rooms *</label>
          <input id="available_rooms" name="available_rooms" type="number" min="0"
            step="1" [(ngModel)]="formModel.available_rooms" required />
        </div>

        <div class="field">
          <label for="room_type">Room Type</label>
          <input id="room_type" name="room_type" type="text" maxlength="100"
            [(ngModel)]="formModel.room_type" />
        </div>
      </div>
    </section>

    <section class="panel" aria-labelledby="amenities-heading">
      <h2 id="amenities-heading">Amenities</h2>
      <div class="field">
        <label for="amenities">Amenities</label>
        <textarea id="amenities" name="amenities" rows="3" [(ngModel)]="amenitiesInput"
          placeholder="Separate amenities with commas or new lines"></textarea>
        <p class="hint">Example: Wi-Fi, Air conditioning, Laundry area</p>
      </div>
    </section>

    <div class="actions">
      <a class="btn btn-outline" routerLink="/boarding-houses">Cancel</a>
      <button type="submit" class="btn btn-primary" [disabled]="isSubmitting">
        {{ isSubmitting ? 'Submitting...' : 'Submit Boarding House' }}
      </button>
    </div>
  </form>
</div>
