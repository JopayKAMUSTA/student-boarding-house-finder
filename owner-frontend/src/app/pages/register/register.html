
<div class="register-page">
  <h1>Create Owner Account</h1>
  <p>Register your account to manage your boarding house listings.</p>

  <form (ngSubmit)="createAccount()" #registerForm="ngForm">

    <div>
      <label for="first_name">First Name</label>
      <input
        type="text"
        id="first_name"
        name="first_name"
        ngModel
        required
      />
    </div>

    <div>
      <label for="middle_name">Middle Name (Optional)</label>
      <input
        type="text"
        id="middle_name"
        name="middle_name"
        ngModel
      />
    </div>

    <div>
      <label for="last_name">Last Name</label>
      <input
        type="text"
        id="last_name"
        name="last_name"
        ngModel
        required
      />
    </div>

    <div>
      <label for="email">Email Address</label>
      <input
        type="email"
        id="email"
        name="email"
        ngModel
        required
      />
    </div>

    <div>
      <label for="contact_number">Contact Number</label>
      <input
        type="tel"
        id="contact_number"
        name="contact_number"
        ngModel
      />
    </div>

    <div>
      <label for="business_name">Boarding House / Business Name</label>
      <input
        type="text"
        id="business_name"
        name="business_name"
        ngModel
      />
    </div>

    <div>
      <label for="business_address">Business Address</label>
      <input
        type="text"
        id="business_address"
        name="business_address"
        ngModel
      />
    </div>

    <div>
      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        name="password"
        ngModel
        minlength="8"
        required
      />
    </div>

    <div>
      <label for="password_confirmation">Confirm Password</label>
      <input
        type="password"
        id="password_confirmation"
        name="password_confirmation"
        ngModel
        minlength="8"
        required
      />
    </div>

    <button type="submit">Create Account</button>
  </form>

  <p>
    Already have an account?
    <a routerLink="/login">Log In</a>
  </p>
</div>
