
<div class="register-page">
  <h1>Create Owner Account</h1>
  <p>Register your account to manage your boarding house listings.</p>

<form (ngSubmit)="createAccount(registerForm)" #registerForm="ngForm">
  <p *ngIf="successMessage" style="color: green;">
  {{ successMessage }}
</p>

<p *ngIf="errorMessage" style="color: red;">
  {{ errorMessage }}
</p>
    <div>
      <label for="first_name">First Name</label>
      <input
        type="text"
        id="first_name"
        name="first_name"
        ngModel
        required
      />
    </div>

    <div>
      <label for="middle_name">Middle Name (Optional)</label>
      <input
        type="text"
        id="middle_name"
        name="middle_name"
        ngModel
      />
    </div>

    <div>
      <label for="last_name">Last Name</label>
      <input
        type="text"
        id="last_name"
        name="last_name"
        ngModel
        required
      />
    </div>

    <div>
      <label for="email">Email Address</label>
      <input
        type="email"
        id="email"
        name="email"
        ngModel
        required
      />
    </div>

    <div>
      <label for="contact_number">Contact Number</label>
      <input
        type="tel"
        id="contact_number"
        name="contact_number"
        ngModel
      />
    </div>

    <div>
      <label for="business_name">Boarding House / Business Name</label>
      <input
        type="text"
        id="business_name"
        name="business_name"
        ngModel
      />
    </div>

    <div>
      <label for="business_address">Business Address</label>
      <input
        type="text"
        id="business_address"
        name="business_address"
        ngModel
      />
    </div>

    <div>
      <label for="password">Password</label>
      <div class="password-input-wrap">
        <input
          [type]="showPassword ? 'text' : 'password'"
          id="password"
          name="password"
          ngModel
          minlength="8"
          required
        />
        <button
          type="button"
          class="password-toggle"
          (click)="showPassword = !showPassword"
          [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
          [attr.aria-pressed]="showPassword"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M2.5 12s3.4-6 9.5-6 9.5 6 9.5 6-3.4 6-9.5 6-9.5-6-9.5-6Z"/>
            <circle cx="12" cy="12" r="2.8"/>
            <path *ngIf="!showPassword" d="m4 4 16 16"/>
          </svg>
        </button>
      </div>
    </div>

    <div>
      <label for="password_confirmation">Confirm Password</label>
      <div class="password-input-wrap">
        <input
          [type]="showPasswordConfirmation ? 'text' : 'password'"
          id="password_confirmation"
          name="password_confirmation"
          ngModel
          minlength="8"
          required
        />
        <button
          type="button"
          class="password-toggle"
          (click)="showPasswordConfirmation = !showPasswordConfirmation"
          [attr.aria-label]="showPasswordConfirmation ? 'Hide confirmation password' : 'Show confirmation password'"
          [attr.aria-pressed]="showPasswordConfirmation"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M2.5 12s3.4-6 9.5-6 9.5 6 9.5 6-3.4 6-9.5 6-9.5-6-9.5-6Z"/>
            <circle cx="12" cy="12" r="2.8"/>
            <path *ngIf="!showPasswordConfirmation" d="m4 4 16 16"/>
          </svg>
        </button>
      </div>
    </div>

<button type="submit" [disabled]="isSubmitting">
  {{ isSubmitting ? 'Creating Account...' : 'Create Account' }}
</button>
  </form>

  <p>
    Already have an account?
    <a routerLink="/login">Log In</a>
  </p>
</div>
