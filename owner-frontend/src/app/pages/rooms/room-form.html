<main class="room-form-page">
  <a [routerLink]="['/owner/boarding-houses', boardingHouseId, 'rooms']">
    Back to Room Management
  </a>
  <h1>{{ roomId === null ? 'Add Room' : 'Edit Room' }}</h1>

  <p *ngIf="isLoading" role="status">Loading room details...</p>
  <p *ngIf="errorMessage" role="alert">{{ errorMessage }}</p>

  <form *ngIf="!isLoading" #roomForm="ngForm" (ngSubmit)="submit(roomForm)">
    <div>
      <label for="room_number">Room Number or Name *</label>
      <input id="room_number" name="room_number" type="text" maxlength="100"
        [(ngModel)]="formModel.room_number" required />
    </div>

    <div>
      <label for="room_type">Room Type *</label>
      <select id="room_type" name="room_type" [(ngModel)]="formModel.room_type" required>
        <option value="" disabled>Select a room type</option>
        <option *ngFor="let type of roomTypes" [value]="type">{{ type }}</option>
      </select>
    </div>

    <div>
      <label for="monthly_rent">Monthly Rent (PHP) *</label>
      <input id="monthly_rent" name="monthly_rent" type="number" min="0.01"
        step="0.01" [(ngModel)]="formModel.monthly_rent" required />
    </div>

    <div>
      <label for="pricing_basis">Pricing Basis *</label>
      <select id="pricing_basis" name="pricing_basis"
        [(ngModel)]="formModel.pricing_basis" required>
        <option *ngFor="let basis of pricingBases" [value]="basis.value">
          {{ basis.label }}
        </option>
      </select>
    </div>

    <div>
      <label for="max_occupants">Maximum Occupants *</label>
      <input id="max_occupants" name="max_occupants" type="number" min="1"
        step="1" [(ngModel)]="formModel.max_occupants" required />
    </div>

    <div>
      <label for="availability_status">Availability *</label>
      <select id="availability_status" name="availability_status"
        [(ngModel)]="formModel.availability_status" required>
        <option *ngFor="let status of availabilityStatuses" [value]="status.value">
          {{ status.label }}
        </option>
      </select>
    </div>

    <div>
      <label for="description">Room Description</label>
      <textarea id="description" name="description" maxlength="10000"
        [(ngModel)]="formModel.description"></textarea>
    </div>

    <fieldset>
      <legend>Room Amenities</legend>
      <label *ngFor="let amenity of amenityOptions" class="amenity-option">
        <input type="checkbox" [checked]="isAmenitySelected(amenity)"
          (change)="toggleAmenity(amenity, $event)" />
        {{ amenity }}
      </label>
      <label for="other-amenities">Add another amenity</label>
      <div class="other-amenity-entry">
        <input id="other-amenities" name="new_amenity" type="text"
          [(ngModel)]="newAmenity" placeholder="Enter an amenity" />
        <button type="button" (click)="addOtherAmenity()">Add Amenity</button>
      </div>
      <ul>
        <li *ngFor="let amenity of otherAmenities; let index = index">
          {{ amenity }}
          <button type="button" (click)="removeOtherAmenity(index)">Remove</button>
        </li>
      </ul>
    </fieldset>

    <fieldset *ngIf="savedImages.length">
      <legend>Saved Room Photos</legend>
      <div class="photo-grid">
        <figure *ngFor="let image of savedImages" [hidden]="!savedImageUrls[image.id]">
          <img [src]="savedImageUrls[image.id]" alt="Saved room photo" />
          <button type="button" (click)="removeSavedImage(image)"
            [disabled]="deletingImageId === image.id">
            {{ deletingImageId === image.id ? 'Removing...' : 'Remove Photo' }}
          </button>
        </figure>
      </div>
    </fieldset>

    <div>
      <label for="room-images">Room Photos (JPEG, PNG, or WebP; up to 5 MB each)</label>
      <input id="room-images" type="file" accept="image/jpeg,image/png,image/webp"
        multiple (change)="selectImages($event)" />
    </div>

    <div *ngIf="selectedImages.length" class="photo-grid" aria-label="Selected photo previews">
      <figure *ngFor="let preview of selectedImages; let index = index">
        <img [src]="preview.url" [alt]="'Preview of ' + preview.file.name" />
        <figcaption>{{ preview.file.name }}</figcaption>
        <button type="button" (click)="removeSelectedImage(index)">Remove</button>
      </figure>
    </div>

    <button type="submit" [disabled]="isSubmitting">
      {{ isSubmitting ? 'Saving...' : roomId === null ? 'Add Room' : 'Save Changes' }}
    </button>
  </form>
</main>
