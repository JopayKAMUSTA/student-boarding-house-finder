<aside class="sidebar">
  <a class="brand" routerLink="/dashboard" aria-label="Owner Portal home">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
    </span>
    <span class="brand-name">Boarding House<br />Manager</span>
  </a>

  <nav aria-label="Owner navigation" class="nav">
    <a routerLink="/dashboard" routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 4h7v7H4zM13 4h7v4h-7zM13 10h7v10h-7zM4 13h7v7H4z"/>
      </svg>
      <span>Dashboard</span>
    </a>
    <a routerLink="/boarding-houses" routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3 21V9l9-6 9 6v12M9 21v-6h6v6"/>
      </svg>
      <span>My Boarding Houses</span>
    </a>
    <a [routerLink]="roomManagementLink"
      [class.active]="isRoomManagementActive()"
      [attr.aria-current]="isRoomManagementActive() ? 'page' : null">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 20V9a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v11M4 20h16M9 13h6"/>
      </svg>
      <span>Room Management</span>
    </a>
    <a routerLink="/owner/tenants" routerLinkActive="active">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="9" cy="8" r="3.5"/>
        <path d="M2.5 20c0-3.5 2.8-5.5 6.5-5.5s6.5 2 6.5 5.5M16 5.5a3.5 3.5 0 0 1 0 6.8M18 15c2.2.7 3.5 2.3 3.5 5"/>
      </svg>
      <span>Tenant Management</span>
    </a>
    <a routerLink="/owner/messages" routerLinkActive="active">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 5h16v12H9l-5 4zM8 9h8M8 13h5"/>
      </svg>
      <span>Messages</span>
    </a>
    <a routerLink="/owner/rental-bills" routerLinkActive="active">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 4h16v16H4zM8 8h8M8 12h8M8 16h4"/>
      </svg>
      <span>Rental Payments</span>
    </a>
    <a routerLink="/owner/reported-information" routerLinkActive="active">
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <path d="M12 3 3 7v5c0 5 3.8 8.5 9 9 5.2-.5 9-4 9-9V7z"/>
    <path d="M12 8v5M12 16h.01"/>
  </svg>
  <span>Reported Information</span>
</a>
    <a routerLink="/owner-profile" routerLinkActive="active">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="8" r="4"/>
        <path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>
      </svg>
      <span>Owner Profile</span>
    </a>
  </nav>

  <button type="button" class="logout" (click)="logout()" [disabled]="isLoggingOut">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M10 17l5-5-5-5M15 12H3M12 3h6a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-6"/>
    </svg>
    <span>{{ isLoggingOut ? 'Signing out...' : 'Logout' }}</span>
  </button>
</aside>
